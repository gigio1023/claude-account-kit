<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 588" width="720" height="588" role="img" aria-labelledby="title desc">
  <title id="title">What the router does on every statusline render</title>
  <desc id="desc">Claude Code runs claude-account-kit as its statusLine.command and hands it rate_limits on stdin. It files that reading under the current account in rate-limits.json, picks the first account the order in config.json still allows, and puts that account's saved login into Claude Code's credential, leaving MCP and plugin tokens in place. Claude Code picks up the new login at the next session.</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse" overflow="visible">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#0D0D0D" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse" overflow="visible">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#929591" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    .entity { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 14px; fill: #0D0D0D; text-anchor: middle; }
    .edge { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 12px; fill: #0D0D0D; text-anchor: middle; }
    .edge-l { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 12px; fill: #0D0D0D; text-anchor: start; }
    .edge-r { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 12px; fill: #0D0D0D; text-anchor: end; }
    .edge-m { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 12px; fill: #929591; text-anchor: middle; }
    .box { fill: #FFFFFF; stroke: #0D0D0D; stroke-width: 1.2; }
    .box-accent { fill: #EAF1FE; stroke: #2E4780; stroke-width: 1.2; }
    .flow { fill: none; stroke: #0D0D0D; stroke-width: 1.2; }
    .flow-secondary { fill: none; stroke: #929591; stroke-width: 1.2; stroke-dasharray: 2 2; }
  </style>
  <rect width="720" height="588" fill="#FFFFFF"/>

  <g id="claude">
    <rect class="box" x="48" y="20" width="264" height="56" rx="16"/>
    <text class="entity" x="180" y="53">Claude Code</text>
  </g>
  <g id="step-file">
    <rect class="box" x="48" y="152" width="264" height="66" rx="16"/>
    <text class="entity" x="180" y="181">file the reading under</text>
    <text class="entity" x="180" y="201">the current account</text>
  </g>
  <g id="step-pick">
    <rect class="box" x="48" y="292" width="264" height="66" rx="16"/>
    <text class="entity" x="180" y="321">pick the first account</text>
    <text class="entity" x="180" y="341">the order still allows</text>
  </g>
  <g id="step-swap">
    <rect class="box-accent" x="48" y="452" width="264" height="66" rx="16"/>
    <text class="entity" x="180" y="481">put its saved login into</text>
    <text class="entity" x="180" y="501">Claude Code's credential</text>
  </g>

  <g id="cache">
    <rect class="box" x="488" y="160" width="208" height="52" rx="16"/>
    <text class="entity" x="592" y="191">rate-limits.json</text>
  </g>
  <g id="config">
    <rect class="box" x="488" y="312" width="208" height="52" rx="16"/>
    <text class="entity" x="592" y="343">config.json</text>
  </g>
  <g id="saved">
    <rect class="box" x="488" y="459" width="208" height="52" rx="16"/>
    <text class="entity" x="592" y="490">saved accounts</text>
  </g>

  <g id="e-claude-file">
    <path class="flow" d="M180 76 V151" marker-end="url(#arrow-ink)"/>
    <text class="edge-l" x="192" y="106">statusLine.command, every render</text>
    <text class="edge-l" x="192" y="124">rate_limits on stdin</text>
  </g>
  <g id="e-file-cache">
    <path class="flow" d="M312 178 H487" marker-end="url(#arrow-ink)"/>
    <text class="edge" x="400" y="170">each reading</text>
  </g>
  <g id="e-cache-pick">
    <path class="flow" d="M488 198 H440 V312 H313" marker-end="url(#arrow-ink)"/>
    <text class="edge-r" x="428" y="262">the others' last readings</text>
  </g>
  <g id="e-file-pick">
    <path class="flow" d="M180 218 V291" marker-end="url(#arrow-ink)"/>
  </g>
  <g id="e-config-pick">
    <path class="flow" d="M488 338 H313" marker-end="url(#arrow-ink)"/>
    <text class="edge-r" x="478" y="330">the order you set</text>
  </g>
  <g id="e-pick-swap">
    <path class="flow" d="M180 358 V451" marker-end="url(#arrow-ink)"/>
    <text class="edge-l" x="192" y="388">current account at its limit,</text>
    <text class="edge-l" x="192" y="406">mode auto</text>
  </g>
  <g id="e-saved-swap">
    <path class="flow" d="M488 485 H313" marker-end="url(#arrow-ink)"/>
    <text class="edge" x="396" y="477">the saved login</text>
  </g>
  <g id="e-swap-claude">
    <path class="flow-secondary" d="M180 518 V556 H20 V48 H47" marker-end="url(#arrow-muted)"/>
    <text class="edge-m" x="100" y="548">next session</text>
  </g>
</svg>
