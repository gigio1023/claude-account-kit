[package]
name = "claude-account-kit"
version = "0.1.0"
edition = "2024"
# let chains, which the routing and statusline code uses, are stable from 1.88.
rust-version = "1.88"
description = "Tools for using several Claude accounts on one machine"
repository = "https://github.com/gigio1023/claude-account-kit"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps the user's settings.json key order intact on install.
serde_json = { version = "1.0", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
